name: Build FrameGen LeviPack

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Android arm64-v8a (.levipack)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Host Simulation & Unit Test Suite
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Isrc -Ipreloader_headers -Itests/host_stubs \
            src/FrameGenConfig.cpp \
            src/CameraSmoother.cpp \
            src/FramePacer.cpp \
            src/GlFrameInterpolator.cpp \
            src/HudRenderer.cpp \
            src/FrameGenMod.cpp \
            tests/framegen_test_suite.cpp \
            -ldl -pthread -o /tmp/framegen_test_suite
          /tmp/framegen_test_suite

      - name: Set up Android NDK r26b
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Configure CMake (Android arm64-v8a)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build libframegen.so
        run: cmake --build build --config Release --parallel

      - name: Strip & Package FrameGen.levipack
        run: |
          "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-unneeded build/libframegen.so
          python3 assets/make_icon.py
          python3 scripts/package_levipack.py \
            --library build/libframegen.so \
            --icon assets/icon.png \
            --output FrameGen.levipack
          python3 scripts/verify_levipack.py FrameGen.levipack

      - name: Commit verified FrameGen.levipack to branch
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FrameGen.levipack
          if ! git diff --cached --quiet; then
            git commit -m "chore: update prebuilt Android arm64-v8a FrameGen.levipack [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload FrameGen.levipack Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameGen-levipack-arm64-v8a
          path: |
            FrameGen.levipack
            build/libframegen.so
            manifest.json
          if-no-files-found: error

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FrameGen.levipack
            build/libframegen.so
          generate_release_notes: true
