name: Build LeviFrameGen

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            unzip \
            zip \
            wget

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-30" "ndk;26.3.11579264"

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Create LeviPack
        run: |
          mkdir -p package

          cp manifest.json package/
          cp build/liblevi_framegen.so package/

          cd package
          zip -r ../LeviFrameGen.levipack .

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: LeviFrameGen
          path: LeviFrameGen.levipack
